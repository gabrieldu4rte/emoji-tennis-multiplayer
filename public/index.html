<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Tennis Online</title>
    <link rel="icon" type="image/png" href="assets/ball_big.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas" width="960" height="600"></canvas>

            <div id="loading-screen" class="screen">
                <div class="loading-title">CARREGANDO</div>
                <div class="loading-track"><div id="loading-bar"></div></div>
            </div>

            <div id="menu-screen" class="screen hidden">
                <img class="logo" src="assets/logo.png" alt="Emoji Tennis">
                <div class="menu-body">
                    <div class="px-panel char-card">
                        <div class="panel-label">SEU PERSONAGEM</div>
                        <canvas id="preview-canvas" width="200" height="150"></canvas>
                        <div id="char-name">Raposa</div>
                    </div>
                    <div class="px-panel picker-card">
                        <div class="panel-label">ESCOLHA</div>
                        <div class="emoji-grid" id="emojis-picker"></div>
                    </div>
                </div>
                <button class="px-btn primary" onclick="connectToServer()">▶ PROCURAR PARTIDA</button>
                <div class="hint">Mova com <kbd>W</kbd><kbd>S</kbd> ou <kbd>↑</kbd><kbd>↓</kbd> · no celular, arraste na quadra</div>
            </div>

            <div id="waiting-screen" class="screen hidden">
                <h1 class="px-title">PROCURANDO OPONENTE</h1>
                <canvas id="waiting-canvas" width="200" height="190"></canvas>
                <div id="status-text">Aguardando outro jogador se conectar...</div>
                <div class="dots"><span></span><span></span><span></span></div>
                <button class="px-btn secondary" onclick="backToMenu()">CANCELAR</button>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <div id="winner-title" class="win">VITÓRIA!</div>
                <canvas id="winner-canvas" width="200" height="150"></canvas>
                <h1 id="winner-text">Jogador 1 venceu!</h1>
                <div id="final-score"></div>
                <button class="px-btn primary" onclick="backToMenu()">VOLTAR AO MENU</button>
            </div>

            <div id="connection-banner" class="hidden"></div>
            <div id="toast" class="hidden"></div>
            <button id="mute-btn" title="Som liga/desliga"><canvas id="mute-canvas" width="33" height="27"></canvas></button>
        </div>
    </div>

    <script src="js/assets.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
