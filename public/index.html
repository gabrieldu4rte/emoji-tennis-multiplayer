<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Tennis Online</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            background: #2e7d32;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 46, 0.95);
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .screen.hidden { opacity: 0; pointer-events: none; z-index: -1; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #4caf50; }
        .player-setup {
            background: #162447;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #0f4c75;
            margin-bottom: 20px;
        }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .emoji-btn {
            font-size: 1.8rem;
            background: #1f4068;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 8px;
            transition: transform 0.1s, background-color 0.2s;
        }
        .emoji-btn:hover { background: #3282b8; transform: scale(1.1); }
        .emoji-btn.selected { background: #4caf50; box-shadow: 0 0 10px #4caf50; }
        .btn-start {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }
        canvas { display: block; background: #2e7d32; }
        #status-text { font-size: 1.5rem; margin-top: 20px; color: #ffbc00; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="menu-screen" class="screen">
            <h1>🎾 Emoji Tennis Online</h1>
            <div class="player-setup">
                <h3>Escolha seu Personagem (Emoji)</h3>
                <div id="my-selected-emoji" style="font-size: 3.5rem; margin: 15px 0;">🦊</div>
                <div class="emoji-grid" id="emojis-picker"></div>
            </div>
            <button class="btn-start" onclick="connectToServer()">PROCURAR PARTIDA</button>
        </div>

        <div id="waiting-screen" class="screen hidden">
            <h1>Procurando Oponente...</h1>
            <div id="status-text">Aguardando outro jogador se conectar...</div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1 id="winner-text">Jogador 1 Venceu!</h1>
            <button class="btn-start" onclick="backToMenu()">Voltar ao Menu</button>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let socket;

        const emojisList = ['🦊', '🤖', '🦁', '🐸', '👽', '👻', '💀', '🤡', '🐼', '🐱', '🦖', '🦄'];
        let myEmoji = '🦊';
        let opponentEmoji = '🤖';

        let myRole = ''; 
        let currentRoomId = '';
        let gameRunning = false;

        const paddleWidth = 40;
        const paddleHeight = 60;
        const ballSize = 24;

        const p1 = { x: 30, y: 220, score: 0, emoji: '🦊' };
        const p2 = { x: 730, y: 220, score: 0, emoji: '🤖' };
        const ball = { x: 400, y: 250, vx: 4, vy: 3, speed: 6 };

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        const picker = document.getElementById('emojis-picker');
        emojisList.forEach(emoji => {
            const btn = document.createElement('button');
            btn.className = `emoji-btn ${emoji === myEmoji ? 'selected' : ''}`;
            btn.innerText = emoji;
            btn.onclick = () => {
                document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                myEmoji = emoji;
                document.getElementById('my-selected-emoji').innerText = emoji;
            };
            picker.appendChild(btn);
        });

        let audioCtx = null;
        function playSound(freq, type = 'sine', duration = 0.1, shouldEmit = false) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);

                if (shouldEmit && socket) {
                    socket.emit('sound_trigger', { roomId: currentRoomId, freq, type, duration });
                }
            } catch (e) {}
        }

        function connectToServer() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('hidden');

            socket = io();

            socket.on('waiting', () => {
                document.getElementById('status-text').innerText = "Procurando um oponente disponível...";
            });

            socket.on('game_start', ({ role, roomId }) => {
                myRole = role;
                currentRoomId = roomId;
                
                socket.emit('choose_emoji', { roomId, role, emoji: myEmoji });

                document.getElementById('waiting-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                
                p1.score = 0;
                p2.score = 0;
                gameRunning = true;
                loop();
            });

            socket.on('emoji_update', ({ p1Emoji, p2Emoji }) => {
                p1.emoji = p1Emoji;
                p2.emoji = p2Emoji;
            });

            socket.on('opponent_move', ({ y }) => {
                if (myRole === 'p1') p2.y = y;
                else p1.y = y;
            });

            socket.on('ball_update', ({ x, y, p1Score, p2Score }) => {
                if (myRole === 'p2') {
                    ball.x = x;
                    ball.y = y;
                    p1.score = p1Score;
                    p2.score = p2Score;
                }
            });

            socket.on('opponent_sound', ({ freq, type, duration }) => {
                playSound(freq, type, duration, false);
            });

            socket.on('opponent_left', () => {
                alert("Seu oponente se desconectou.");
                backToMenu();
            });
        }

        function moveLocalPaddle() {
            let myPaddle = myRole === 'p1' ? p1 : p2;
            let moved = false;

            if (keys['w'] || keys['W'] || keys['ArrowUp']) {
                myPaddle.y = Math.max(0, myPaddle.y - 6);
                moved = true;
            }
            if (keys['s'] || keys['S'] || keys['ArrowDown']) {
                myPaddle.y = Math.min(canvas.height - paddleHeight, myPaddle.y + 6);
                moved = true;
            }

            if (moved && socket) {
                socket.emit('move_paddle', { roomId: currentRoomId, y: myPaddle.y });
            }
        }

        function updatePhysics() {
            if (myRole !== 'p1') return;

            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.y <= 0 || ball.y >= canvas.height - ballSize) {
                ball.vy = -ball.vy;
                playSound(300, 'sine', 0.08, true);
            }

            if (ball.vx < 0 && ball.x <= p1.x + paddleWidth && ball.x >= p1.x) {
                if (ball.y + ballSize >= p1.y && ball.y <= p1.y + paddleHeight) {
                    let collidePoint = (ball.y + ballSize/2) - (p1.y + paddleHeight/2);
                    collidePoint = collidePoint / (paddleHeight/2);
                    let angleRad = (Math.PI/4) * collidePoint;

                    ball.speed += 0.4;
                    ball.vx = Math.cos(angleRad) * ball.speed;
                    ball.vy = Math.sin(angleRad) * ball.speed;
                    playSound(450, 'triangle', 0.12, true);
                }
            }

            if (ball.vx > 0 && ball.x + ballSize >= p2.x && ball.x <= p2.x + paddleWidth) {
                if (ball.y + ballSize >= p2.y && ball.y <= p2.y + paddleHeight) {
                    let collidePoint = (ball.y + ballSize/2) - (p2.y + paddleHeight/2);
                    collidePoint = collidePoint / (paddleHeight/2);
                    let angleRad = (Math.PI/4) * collidePoint;

                    ball.speed += 0.4;
                    ball.vx = -Math.cos(angleRad) * ball.speed;
                    ball.vy = Math.sin(angleRad) * ball.speed;
                    playSound(450, 'triangle', 0.12, true);
                }
            }


            if (ball.x < 0) {
                p2.score++;
                playSound(150, 'sawtooth', 0.3, true);
                checkGameOver();
                resetBall(1);
            } else if (ball.x > canvas.width) {
                p1.score++;
                playSound(600, 'sine', 0.3, true);
                checkGameOver();
                resetBall(-1);
            }

            socket.emit('sync_ball', {
                roomId: currentRoomId,
                x: ball.x,
                y: ball.y,
                p1Score: p1.score,
                p2Score: p2.score
            });
        }

        function resetBall(direction) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 6;
            ball.vx = direction * ball.speed;
            ball.vy = (Math.random() * 2 - 1) * 3;
        }

        function checkGameOver() {
            const maxPoints = 5;
            if (p1.score >= maxPoints || p2.score >= maxPoints) {
                gameRunning = false;
                const winner = p1.score >= maxPoints ? `Jogador 1 (${p1.emoji}) Venceu!` : `Jogador 2 (${p2.emoji}) Venceu!`;
                document.getElementById('winner-text').innerText = winner;
                document.getElementById('game-over-screen').classList.remove('hidden');
            }
        }

        function draw() {
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText(p1.score, canvas.width / 4, 50);
            ctx.fillText(p2.score, (canvas.width / 4) * 3, 50);

            ctx.font = '44px Arial';
            ctx.fillText(p1.emoji, p1.x + 20, p1.y + 45);
            ctx.fillText(p2.emoji, p2.x + 20, p2.y + 45);

            ctx.fillText('🎾', ball.x + 12, ball.y + 20);
        }

        function loop() {
            if (!gameRunning) return;
            moveLocalPaddle();
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        function backToMenu() {
            if (socket) {
                socket.disconnect();
            }
            gameRunning = false;
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
